</head>

<body>
    <header class="header header--landing" id="Home">
        <img src="Resources/Images/Logos/big-logo.svg" alt="Main logo" class="main-logo" />
    </header>

    <!--Navigation-->
    <nav class="nav">
        <div class="burger-button">
            <div></div>
        </div>
        <ul class="nav__menu">
            <li><a href="#Home" class="nav__item"><span>Home</span></a></li>
            <li><a href="#About" class="nav__item"><span>About us</span></a></li>
            <li><a href="#References" class="nav__item"><span>References</span></a></li>
            <li><a href="#Contact" class="nav__item"><span>Contact</span></a></li>
        </ul>
    </nav>

    <main>
        <section class="section section--slider">
            <div class="slider">
                <div class="slider__item slider__item--first"><h3>Výstavy</h3></div>
                <div class="slider__item slider__item--second"><h3>Tisk/Výroba</h3></div>
                <div class="slider__item slider__item--third"><h3>Polepy</h3></div>
            </div>
        </section>
        <section class="section section--about" id="About">
            <div class="container">
                <h2 class="section__title">About</h2>
            </div>
        </section>
        <section class="section section--references" id="References">
            <div class="container">
                <h2 class="section__title">References</h2>
            </div>
        </section>
        <section class="section section--contact" id="Contact">
            <div class="container">
                <h2 class="section__title">Contact</h2>
                <form class="form" method="post">
                    <div class="form__wrapper">
                        <input type="text" class="form__input" required />
                        <label class="form__label">Jméno *</label>
                    </div>
                    <div class="form__wrapper">
                        <input type="text" class="form__input" required />
                        <label class="form__label">Příjmění *</label>
                    </div>
                    <div class="form__wrapper">
                        <input type="email" class="form__input" required />
                        <label class="form__label">Email *</label>
                    </div>
                    <div class="form__wrapper">
                        <input type="tel" class="form__input" required pattern="*."/>
                        <label class="form__label">Telefon</label>
                    </div>
                    <div class="form__wrapper">
                        <input type="number" class="form__input" required />
                        <label class="form__label">Aktuální rok *</label>
                    </div>
                    <div class="form__wrapper">
                        <textarea class="form__input form__input--textarea" required></textarea>
                        <label class="form__label">Vaše zpráva *</label>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <div class="footer__box">
                <p class="footer__text-item footer__text-item--user">
                    Martin Luksaj
                </p>
                <p class="footer__text-item footer__text-item--ic">
                    3327108
                </p>
                <p class="footer__text-item footer__text-item--mail">  
                    <a href="mailto:info@brand-design.cz?subject=Správa_z_brand-design.cz" class="footer__link">info@brand-design.cz</a>
                </p>
                <p class="footer__text-item footer__text-item--phone">
                    <a href="tel:+420 777 135 686" class="footer__link">+420 777 135 686</a>
                </p>
            </div>
            <div class="footer__box footer__box--social">

            </div>
            <div class="footer__box">

            </div>
            <div class="footer__box footer__box--full-flex">
                <p class="footer__text-item">
                    <strong>
                        ©BrandDESIGN&nbsp;
                    </strong>
                    2018, Všechna práva vyhrazena
                </p>
            </div>
        </div>
    </footer>

    <script src="Resources/Scripts/Libs/jQuery/jquery-3.3.1.min.js" type="text/javascript"></script>
    <script src="Resources/Scripts/Libs/Slick/slick.min.js" type="text/javascript"></script>
    <script src="Resources/Scripts/JS/Init.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            $('.slider').slick({
                infinite: true,
                slidesToShow: 1,
                slidesToScroll: 1,
                speed: 1000,
                autoplay: true,
                autoplaySpeed: 4000,
                dots: false,
                focusOnSelect: false,
                arrows: false,
                fade: true
            });
        });
    </script>
</body>
</html>

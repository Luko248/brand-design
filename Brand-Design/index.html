    <link rel="icon" type="image/png" sizes="32x32" href="../wwwroot/images/Favicons/favicon-32x32.png">

    <link rel="manifest" href="../wwwroot/images/Favicons/site.webmanifest">

    <!-- Open Graph data -->
    <meta property="og:title" content="Brand-Design" />

    <meta property="og:image" content="" />

    <!-- Twitter Card data -->
    <meta name="twitter:card" content="">

    <link href="Resources/Stylesheets/CSS/style.css" rel="stylesheet" />
</head>

<body>
    <header class="header header--landing">
        <img src="Resources/Images/Logos/big-logo.svg" alt="Main logo" class="main-logo" />
    </header>

    <!--Navigation-->
    <nav class="navigation">
        <div class="burger-button">
            <div></div>
        </div>
        <ul class="menu">
            <li><a href="/"><span>Home</span></a></li>
            <li><a href="/"><span>About us</span></a></li>
            <li><a href="/"><span>References</span></a></li>
            <li><a href="/"><span>Contact</span></a></li>
        </ul>
    </nav>

    <main>
        <div class="slider">
            <div class="slider__item slider__item--first"><h3>Výstavy</h3></div>
            <div class="slider__item slider__item--second"><h3>Tisk/Výroba</h3></div>
            <div class="slider__item slider__item--third"><h3>Polepy</h3></div>
        </div>
        <section class="section-about">
            <div class="container">
                <h2 class="section-title">About</h2>
            </div>
        </section>
        <section class="section-references">
            <div class="container">
                <h2 class="section-title">References</h2>
            </div>
        </section>
        <section class="section-contact">
            <div class="container">
                <h2 class="section-title">Contact</h2>
                <form class="form" method="post">
                    <div>
                        <input type="text" placeholder="Jméno *" class="form-input" autofocus />
                    </div>
                    <div>
                        <input type="text" placeholder="Příjmění *" class="form-input" />
                    </div>
                    <div>
                        <input type="email" placeholder="E-mail *" class="form-input" />
                    </div>
                    <div>
                        <input type="tel" placeholder="Telefon" class="form-input" />
                    </div>
                    <div class="full">
                        <input type="number" placeholder="Aktuální rok *" class="form-input" />
                    </div>
                    <div class="full">
                        <textarea placeholder="Vaše zpráva *" class="form-input__textarea"></textarea>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="conainer">

        </div>
    </footer>

    <script src="Resources/Scripts/Libs/jQuery/jquery-3.3.1.min.js" type="text/javascript"></script>
    <script src="Resources/Scripts/Libs/Slick/slick.min.js" type="text/javascript"></script>
    <script src="Resources/Scripts/JS/Init.js" type="text/javascript"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            $('.slider').slick({
                infinite: true,
                slidesToShow: 1,
                slidesToScroll: 1,
                speed: 1000,
                autoplay: true,
                autoplaySpeed: 4000,
                dots: false,
                focusOnSelect: false,
                arrows: false,
                fade: true
            });
        });
    </script>
</body>
</html>
